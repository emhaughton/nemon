# fly.toml para el backend de Nemon
# Ajusta `app` y `primary_region` según tu cuenta Fly.
app = "nemon-backend"
primary_region = "iad"
command = "php-fpm"

[build]
  context = ".."
  dockerfile = "docker/php/Dockerfile"
  args = { PHP_VERSION = "8.5-fpm" }

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"
  DB_CONNECTION = "mysql"
  DB_HOST = "nemon-db.internal"
  DB_PORT = "3306"
  DB_DATABASE = "nemon"
  DB_USERNAME = "nemon"
  DB_PASSWORD = "root"
  CACHE_DRIVER = "redis"
  SESSION_DRIVER = "cookie"
  QUEUE_CONNECTION = "sync"
  REDIS_HOST = "nemon-redis.internal"

[[services]]
  internal_port = 9000
  protocol = "tcp"

  [services.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[services.ports]]
    handlers = ["http"]
    port = 80
